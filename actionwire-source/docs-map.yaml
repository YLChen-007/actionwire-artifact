# docs-map.yaml —— 文档 ↔ 代码映射的单一事实源
#
# 谁读它：scripts/check_doc_drift.py（Stop/PostToolUse/SessionStart 三 hook 共用）与 Claude 本身。
# 为什么存在：本项目文档承载的是「方法论与意图」，无法从代码机械推导；此文件把
#            「哪份文档管辖哪些代码」显式化，让「改代码 → 改文档」不脱节可被检测。
#
# kind 语义（决定强制力度——见 .claude/settings.json）：
#   spec             手工维护的设计/意图文档；改了 code 就必须同步改 doc —— Stop hook 硬门禁。
#   generated        由 generator 从 inputs 生成的文档；改了 inputs 需重跑 generator —— 仅提醒，不硬拦。
#   external_anchors 文档钉向外部被分析项目的 file:line；工作区 hook 看不到 —— 仅登记，符号校验属 Phase 3。
#
# 路径均相对仓库根（git rev-parse --show-toplevel）。glob：`*` 与 `**` 均匹配任意字符（含 /）。
# 多项目：新增项目在 projects.<name> 下另起一段；通用框架、Hermes 与 CowAgent 分开登记。
#
# 结构说明：CodeQL 查询在 src/ql/；hermes-agent 的设计+实现文档统一在 design/hermes-agent/；
#          sink 能力卡生成器在 src/sink_capacity/。

